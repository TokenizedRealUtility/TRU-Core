# Add inside the existing HTTPS server block. Do not expose Core RPC.
location /easy-swap/ {
    proxy_pass http://127.0.0.1:8651;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    client_max_body_size 500k;
    add_header Cache-Control "no-store" always;
}
# Optional public alias for the hosted service's confirmed trade feed.
location = /api/markets/swaps {
    proxy_pass http://127.0.0.1:8651/easy-swap/api/markets;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
}
