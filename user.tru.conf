# ============================================================
# TRU BLOCKCHAIN v0.06 — NORMAL USER / WALLET NODE
# Save as tru.conf. No port forwarding needed.
#
# Only keys the v0.06 code actually reads are listed here.
# Duplicate keys: the LAST one wins, so put multiple peers
# on ONE line, comma separated, no spaces.
# ============================================================

[network]

# --- Privileged Core RPC: this machine only -----------------
rpcbind=127.0.0.1
rpcport=21832
rpcAllowRemote=0
rpcMaxConnections=32

# --- P2P ----------------------------------------------------
p2pPort=21833

# 0 = outbound only (typical home connection behind a router).
# Set 1 only if you forward TCP 21833 to this machine.
listen=0

# Leave externalip unset unless listen=1 with a public IP.
# externalip=YOUR_PUBLIC_IP

# --- Bootstrap ----------------------------------------------
# All public TRU seeds, one line, comma separated, no spaces.
seeds=137.184.68.43:21833

# --- Fork handling (required for multi-node operation) ------
automaticReorg=1


[default]

node.ip=127.0.0.1
node.port=21832
