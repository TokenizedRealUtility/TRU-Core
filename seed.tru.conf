# ============================================================
# TRU BLOCKCHAIN v0.06 — PUBLIC MAINNET SEED NODE
# Save as tru.conf on the seed machine.
#
# Only keys the v0.06 code actually reads are listed here.
# Duplicate keys: the LAST one wins, so put multiple peers
# on ONE line, comma separated, no spaces.
# ============================================================

[network]

# --- Privileged Core RPC: this machine only -----------------
rpcbind=127.0.0.1
rpcport=21832
rpcAllowRemote=0
rpcMaxConnections=32
# Auth is automatic: Core creates a token/cookie on first start.
# rpcUser / rpcPassword / rpcAuthEnabled are NOT read.

# --- P2P ----------------------------------------------------
p2pPort=21833
listen=1

# This seed's real public IPv4. Used so the node never dials
# itself and never saves itself into peers.dat.
externalip=YOUR_PUBLIC_IP

# --- Bootstrap ----------------------------------------------
# The OTHER public seeds. Do not list this machine.
seeds=137.184.68.43:21833

# Optional extra peers (same format, one line).
# addnode=IP1:21833,IP2:21833

# --- Fork handling (required for multi-node operation) ------
automaticReorg=1


[default]

# Local Core endpoint for tru-cli, oracle service, etc.
node.ip=127.0.0.1
node.port=21832

# Only if this machine runs the oracle/evolution anchor wallet:
# oracle.address=YOUR_ORACLE_ADDRESS
# oracle.wallet=tru.dat
